<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrganismZero</title>
  <meta name="description" content="OrganismZero">
  <link rel="icon" href="https://github.com/organismzero.png?size=64">
  <style>
    :root { --bg: #fafafa; --fg: #111; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 16px; }
    img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 24px;
    }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
  </style>
</head>
<body>
  <main>
    <!-- github.com/<user>.png always redirects to the current avatar -->
    <img src="https://github.com/organismzero.png?size=320" alt="OrganismZero's GitHub avatar" width="160" height="160">
    <h1>OrganismZero</h1>
  </main>
</body>
</html>
